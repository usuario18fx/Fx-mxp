function distM(a, b) {
  const R = 6371000,
        dLat = (b[1] - a[1]) * Math.PI / 180,
        dLng = (b[0] - a[0]) * Math.PI / 180,
        la1 = a[1] * Math.PI / 180,
        la2 = b[1] * Math.PI / 180,
        h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function encD(d, k) {
  try { return CryptoJS.AES.encrypt(JSON.stringify(d), k).toString(); } catch { return null; }
}
function decD(s, k) {
  try { const b = CryptoJS.AES.decrypt(s, k); return JSON.parse(b.toString(CryptoJS.enc.Utf8)); } catch { return null; }
}

// ─── D-PAD CONTROLS ────────────────────────────────────────────
function dpadAction(dir) {
  vibra();
  const ease = opts => map.easeTo({ ...opts, duration: 220, essential: true });
  if (dir === 'up') {
    ctrlMode === 'zoom' ? ease({ zoom: Math.min(18, map.getZoom() + .35) }) : ease({ pitch: Math.min(80, map.getPitch() + 5) });
  } else if (dir === 'dn') {
    ctrlMode === 'zoom' ? ease({ zoom: Math.max(10, map.getZoom() - .35) }) : ease({ pitch: Math.max(0, map.getPitch() - 5) });
  } else if (dir === 'lt') {
    ease({ bearing: map.getBearing() - 12 });
  } else if (dir === 'rt') {
    ease({ bearing: map.getBearing() + 12 });
  }
}

function startHold(dir) {
  dpadAction(dir);
  const iv = setInterval(() => dpadAction(dir), 180);
  const stop = () => { clearInterval(iv); document.removeEventListener('mouseup', stop); document.removeEventListener('touchend', stop); };
  document.addEventListener('mouseup', stop);
  document.addEventListener('touchend', stop);
}

// ─── BUILDING HIGHLIGHTS ──────────────────────────────────────
function ensureBuildingHighlightLayers() {
  if (buildingHighlightReady) return;
  if (!map.getSource('fx-building-highlights')) {
    map.addSource('fx-building-highlights', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
  }
  if (!map.getLayer('fx-building-highlight-fill')) {
    map.addLayer({
      id: 'fx-building-highlight-fill',
      type: 'fill-extrusion',
      source: 'fx-building-highlights',
      paint: {
        'fill-extrusion-color': ['get', 'color'],
        'fill-extrusion-base': ['coalesce', ['get', 'base'], 0],
        'fill-extrusion-height': ['coalesce', ['get', 'height'], 28],
        'fill-extrusion-opacity': 0.96,
        'fill-extrusion-vertical-gradient': true
      }
    });
  }
  if (!map.getLayer('fx-building-highlight-outline')) {
    map.addLayer({
      id: 'fx-building-highlight-outline',
      type: 'line',
      source: 'fx-building-highlights',
      paint: {
        'line-color': ['get', 'lineColor'],
        'line-width': 2.2,
        'line-opacity': 0.95
      }
    });
  }
  buildingHighlightReady = true;
}

function squarePolygonAround(lng, lat, size = 0.000055) {
  return [[
    [lng - size, lat - size],
    [lng + size, lat - size],
    [lng + size, lat + size],
    [lng - size, lat + size],
    [lng - size, lat - size]
  ]];
}

function getBuildingFeatureForPoint(item) {
  const point = map.project([item.lng, item.lat]);
  const feats = map.queryRenderedFeatures([[point.x - 8, point.y - 8], [point.x + 8, point.y + 8]], { layers: ['building'] }) || [];
  const picked = feats.find(f => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'));
  if (picked) {
    const height = Number(picked.properties?.height || picked.properties?.render_height || 32);
    const base = Number(picked.properties?.min_height || picked.properties?.render_min_height || 0);
    return { geometry: picked.geometry, height: Math.max(height, 18), base: Math.max(base, 0) };
  }
  return { geometry: { type: 'Polygon', coordinates: squarePolygonAround(item.lng, item.lat) }, height: 26, base: 0 };
}

function renderMarkers() {
  ensureBuildingHighlightLayers();
  const fc = {
    type: 'FeatureCollection',
    features: places.map(item => {
      const cl = CLASS_META[item.classification || 'save'] || CLASS_META.save;
      const picked = getBuildingFeatureForPoint(item);
      return {
        type: 'Feature',
        geometry: picked.geometry,
        properties: {
          id: item.id,
          title: item.title,
          classification: item.classification || 'save',
          color: item.color || cl.c,
          lineColor: '#64a8ff',
          height: picked.height,
          base: picked.base
        }
      };
    })
  };
  const src = map.getSource('fx-building-highlights');
  if (src) src.setData(fc);
}

function renderAI() {

function handleFiles(files, store = false) {
  Array.from(files || []).forEach(file => {
    const ok = file.type.startsWith('image/') || file.type.startsWith('video/');
    if (!ok) return;
    const r = new FileReader();
    r.onload = () => {
      const item = { id: crypto.randomUUID(), name: file.name, type: file.type, url: r.result, createdAt: new Date().toISOString() };
      if (store) { mediaStore.unshift(item); svl(SK.media, mediaStore); renderMediaGrid(); toast('✓ Archivo almacenado (cifrado)'); } 
      else { pendingMedia.push(item); renderSaveMedia(); }
    };
    r.readAsDataURL(file);
  });
}

// ─── GEOCODING ──────────────────────────────────────────────────
async function geocodeSearch(term) {
  const q = (term || '').trim();
  const res = $('search-results');
  if (!q) { 
    res.classList.remove('open'); 
    res.innerHTML = ''; 
    return; 
  }
  
  const savedResults = searchPlacesByTerm(q);
  
  res.innerHTML = '<div class="sr-loading"><div class="dots"><span></span><span></span><span></span></div>&nbsp;buscando...</div>';
  res.classList.add('open');
  
  try {
    if (searchAbort) searchAbort.abort();
    searchAbort = new AbortController();
    const proximity = `${userLocation[0]},${userLocation[1]}`;
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${mapboxgl.accessToken}&limit=6&language=es&proximity=${proximity}`;
    
    const r = await fetch(url, { signal: searchAbort.signal });
    if (!r.ok) throw new Error('geocode http ' + r.status);
    
    const data = await r.json();
    const feats = data?.features || [];
    
    let allResults = [];
    
    savedResults.forEach(p => {
      allResults.push({
        type: 'saved',
        id: p.id,
        title: p.title,
        place_name: p.notes || p.title || '',
        center: [p.lng, p.lat],
        color: p.color || '#d4ff00',
        isSaved: true
      });
    });
    
    feats.forEach(f => {
      const exists = allResults.some(r => 
        r.type === 'saved' && 
        Math.abs(r.center[0] - f.center[0]) < 0.0001 && 
        Math.abs(r.center[1] - f.center[1]) < 0.0001
      );
      if (!exists) {
        allResults.push({
          type: 'geocode',
          id: f.id,
          title: f.text || f.place_name || '',
          place_name: f.place_name || '',
          center: f.center,
          color: null,
          isSaved: false
        });
      }
    });
    
    if (!allResults.length) {
      res.innerHTML = '<div class="sr-empty">Sin resultados para "' + esc(q) + '"</div>';
      return;
    }
    
    res.innerHTML = allResults.map((item, i) => `
      <div class="sr ${item.isSaved ? 'sr-local' : ''}" data-idx="${i}" style="${item.isSaved ? `border-left:3px solid ${item.color || '#d4ff00'}` : ''}">
        <span class="sr-icon" style="${item.isSaved ? `color:${item.color || '#d4ff00'}` : ''}">${item.isSaved ? '📍' : '⚑'}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;${item.isSaved ? `color:${item.color || '#d4ff00'}` : ''}">${esc(item.title)}</div>
          <div style="font-size:10px;color:var(--text-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(item.place_name)}</div>
        </div>
        <span class="sr-tag ${item.isSaved ? 'local' : 'map'}" style="${item.isSaved ? `background:${item.color || '#d4ff00'}22;color:${item.color || '#d4ff00'}` : ''}">
          ${item.isSaved ? '★ GUARDADO' : 'MAPA'}
        </span>
      </div>
    `).join('');
    
    res.querySelectorAll('.sr[data-idx]').forEach(item => {
      item.addEventListener('click', function() {
        const idx = parseInt(this.dataset.idx);
        const data = allResults[idx];
        if (!data) return;
        const [lng, lat] = data.center;
        
        map.flyTo({ 
          center: [lng, lat], 
          zoom: 17, 
          pitch: BASE.pitch, 
          bearing: BASE.bearing, 
          duration: 900, 
          essential: true 
        });
        
        res.classList.remove('open');
        res.innerHTML = '';
        
        if (data.isSaved) {
          openPhotoModal(lng, lat, data.place_name || data.title, data.id);
        } else {
          showSearchConfirmMarker(lng, lat, data.place_name || data.title);
        }
        setExplore(false);
      });
    });
    
  } catch (e) {
    if (e?.name === 'AbortError') return;
    res.innerHTML = '<div class="sr-empty">Error de búsqueda. Intenta de nuevo.</div>';
  }
}

async function reverseGeocode(lng, lat) {
  try {
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${mapboxgl.accessToken}&language=es&limit=1`;
    const r = await fetch(url);
    if (!r.ok) return '';
    const data = await r.json();
    return data?.features?.[0]?.place_name || '';
  } catch (e) { return ''; }
}

function clearSearchConfirmMarker() {

function showSearchConfirmMarker(lng, lat, address = '', placeId = null) {
  clearSearchConfirmMarker();
  searchConfirmPoint = { lng, lat };
  searchConfirmAddress = address || '';
  
  const existingPlace = placeId ? places.find(p => p.id === placeId) : findPlaceNear(lng, lat);
  const color = existingPlace?.color || '#d4ff00';
  
  const el = document.createElement('div');
  el.className = 'search-confirm-marker';
  const pin = document.createElement('span');
  pin.textContent = '📍';
  pin.style.cssText = `filter:drop-shadow(0 4px 10px rgba(0,0,0,.65)) drop-shadow(0 0 12px ${color}60);pointer-events:none`;
  el.appendChild(pin);
const _onClick = () => openPhotoModal(lng, lat, address, placeId);
  el.addEventListener('click', e => { e.stopPropagation(); _onClick(); });
  el.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); _onClick(); }, { passive: false });
  searchConfirmMarker = new mapboxgl.Marker({ element: el, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map);
  const res = $('search-results');
  if (res) {
    const oldConfirm = document.getElementById('sr-confirm');
    if (oldConfirm) oldConfirm.remove();
    
    const wrap = document.createElement('div');
    wrap.className = 'sr-confirm';
    wrap.id = 'sr-confirm';
    wrap.innerHTML = `
      <div style="font-size:10px;color:var(--text-muted);line-height:1.5;display:flex;align-items:center;gap:6px">
        <span style="color:${color}">
          📍
        </span> 
        ${existingPlace ? '★ ' : ''}${esc(address||'Ubicación marcada')}
        ${existingPlace ? `<span style="color:${color};font-size:8px;background:${color}22;padding:2px 8px;border-radius:4px">GUARDADO</span>` : ''}
      </div>
      <button class="sr-confirm-btn" id="sr-confirm-btn" style="${existingPlace ? `border-color:${color};color:${color}` : ''}">
        ${existingPlace ? 'Ver lugar' : 'Guardar lugar'}
      </button>
    `;
    res.appendChild(wrap);
    res.classList.add('open');
    
    $('sr-confirm-btn').addEventListener('click', () => { 
      if (existingPlace) {
        openPhotoModal(lng, lat, address, placeId);
      } else {
        openSaveModal(lng, lat, address);
      }
      res.classList.remove('open');
      clearSearchConfirmMarker();
    });
  }
}

function searchPlacesByTerm(term) {
  const q = (term || '').toLowerCase().trim();
  if (!q) return [];
  return places.filter(place => {
    const title = (place.title || '').toLowerCase();
    const notes = (place.notes || '').toLowerCase();
    const label = (place.label || '').toLowerCase();
    const hashtag = (place.hashtag || '').toLowerCase();
    const address = (place.address || '').toLowerCase();
    return title.includes(q) || notes.includes(q) || label.includes(q) || 
           hashtag.includes(q) || address.includes(q);
  });
}

function localSearch(term) {
  const results = searchPlacesByTerm(term);
  const res = $('search-results');
  if (!term.trim()) { 
    res.classList.remove('open'); 
    res.innerHTML = ''; 
    return; 
  }
  if (!results.length) { 
    res.innerHTML = '<div class="sr-empty">Sin coincidencias en tus datos guardados.</div>'; 
    res.classList.add('open'); 
    return; 
  }
  res.innerHTML = results.map(p => `
    <div class="sr sr-local" data-id="${p.id}" style="border-left:3px solid ${p.color || '#d4ff00'}">
      <span class="sr-icon" style="color:${p.color || '#d4ff00'}">📍</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:${p.color || '#d4ff00'}">${esc(p.title)}</div>
        <div style="font-size:10px;color:var(--text-muted)">${esc(p.notes||p.hashtag||'')}</div>
      </div>
      <span class="sr-tag local" style="background:${p.color || '#d4ff00'}22;color:${p.color || '#d4ff00'}">GUARDADO</span>
    </div>
  `).join('');
  res.classList.add('open');
  res.querySelectorAll('[data-id]').forEach(item => {
    item.addEventListener('click', function() {
      const p = results.find(x => x.id === this.dataset.id);
      if (!p) return;
      map.flyTo({ center: [p.lng, p.lat], zoom: 17, pitch: BASE.pitch, bearing: BASE.bearing, duration: 900, essential: true });
      setExplore(false);
      res.classList.remove('open');
      res.innerHTML = '';
      showSearchConfirmMarker(p.lng, p.lat, p.notes || p.title || '', p.id);
    });
  });
}

function initSearch() {
  const si1 = $('si1'),
        sc1 = $('sc1'),
        res = $('search-results');
  si1.addEventListener('input', () => {
    $('sb1').classList.toggle('has-text', si1.value.length > 0);
    armSearchIdle();
    clearTimeout(st1);
    if (searchMode === 'saved') {
      st1 = setTimeout(() => localSearch(si1.value), 250);
    } else {
      if (si1.value.trim().length < 3) { res.classList.remove('open'); res.innerHTML = ''; return; }
      st1 = setTimeout(() => geocodeSearch(si1.value.trim()), 450);

function pickToSave(classification) {
  if (!pickPoint) return;

// ─── PHOTO MODAL ───────────────────────────────────────────────
function findPlaceNear(lng, lat, tol = 0.0003) {
  return places.find(p => Math.abs(p.lng - lng) < tol && Math.abs(p.lat - lat) < tol) || null;
}

function renderPhotoFlags(existing) {
  const el = $('photo-flags');
  if (!el) return;
  const currentCls = existing?.classification || null;
  el.innerHTML = FLAG_ORDER.map(k => {
    const m = CLASS_META[k];
    const sel = currentCls === k ? ' sel' : '';
    return `<button type="button" class="pick-flag${sel}" data-cls="${k}" title="${m.l}"><span class="flagico" style="background:${m.c}"></span><span class="flaglbl">${m.l}</span></button>`;
  }).join('');
  el.querySelectorAll('.pick-flag[data-cls]').forEach(b => b.addEventListener('click', () => photoSetFlag(b.dataset.cls)));
}

function photoSetFlag(classification) {
  if (!photoPoint) return;
  const { lng, lat } = photoPoint;
  const addr = photoAddress;
  if (photoExistingId) {
    const p = places.find(x => x.id === photoExistingId);
    if (p) {
      p.classification = classification;
      p.color = CLASS_META[classification]?.c || p.color;
      saveAll();
      renderAll();
      toast(`✓ Clasificado como ${CLASS_META[classification]?.l || classification}`);
      openPhotoModal(lng, lat, addr, photoExistingId);
      return;
    }
  }
  pendingClass = classification;
  pendingColor = CLASS_META[classification]?.c || COLORS[0].v;
  closePhotoModal();
  openSaveModal(lng, lat, addr);
}

function openPhotoModal(lng, lat, address = '', placeId = null) {
  photoPoint = { lng, lat };
  photoAddress = address || '';
  const existing = placeId ? places.find(p => p.id === placeId) : findPlaceNear(lng, lat);
  photoExistingId = existing ? existing.id : null;
  const cl = CLASS_META[existing?.classification || 'save'] || CLASS_META.save;
  const color = existing?.color || cl.c || '#d4ff00';
  const name = existing?.title || (address ? address.split(',')[0].trim() : 'Lugar sin nombre');
  
  $('photo-name').textContent = name;
  $('photo-name').style.color = color;
  $('photo-cat').textContent = address || 'Ubicación sin dirección registrada';
  $('photo-meta').innerHTML = existing
    ? `<span class="ctag ${cl.t}" style="border-color:${color}">${cl.e} ${cl.l}</span>`
    : `<span class="ctag safe">⚑ Nuevo</span>`;
  
  const img = (existing?.media || [])[0];
  const wrap = $('photo-img-wrap');
  wrap.innerHTML = img ? `<img src="${esc(img.url)}" alt=""/>` : `<span class="noimg-ico" style="color:${color}">${cl.e}</span>`;
  $('photo-vip-btn').classList.toggle('photo-vip-active', !!existing?.vip);
  renderPhotoFlags(existing);
  $('photo-modal').classList.add('open');
}

function closePhotoModal() { $('photo-modal').classList.remove('open'); photoPoint = null; photoExistingId = null; }

function photoToSave() {
  if (!photoPoint) return;
  const { lng, lat } = photoPoint;
  const addr = photoAddress;
  pendingClass = 'save';
  pendingColor = CLASS_META.save.c;
  closePhotoModal();
  openSaveModal(lng, lat, addr);
}

function photoToggleVip() {
  if (photoExistingId) {
    const p = places.find(x => x.id === photoExistingId);
    if (p) { p.vip = !p.vip; saveAll(); renderAll(); toast(p.vip ? '𖣿 Agregado a VIP' : 'Quitado de VIP'); $('photo-vip-btn').classList.toggle('photo-vip-active', !!p.vip); return; }
  }
  if (!photoPoint) return;
  toast('Guarda primero este lugar para marcarlo como VIP');
}

// ─── EXPORT / IMPORT ──────────────────────────────────────────
function exportJson() {
  const b = new Blob([JSON.stringify({ places, routes, labels, meta: { exportedAt: new Date().toISOString(), v: 'X11' } }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `fxmap-x11-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJson(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (p.places && Array.isArray(p.places)) places = p.places;
      else if (Array.isArray(p)) places = p;
      if (p.routes) routes = p.routes;
      saveAll();
      renderAll();
      toast(`✓ ${places.length} lugares importados`);
    } catch { toast('Archivo inválido'); }
  };
  r.readAsText(file);
}

      if ($('menu-panel')?.classList.contains('open')) closeMenuModal();
      closeAll();
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#act-color')) {
      const palette = $('palette');
      if (palette) palette.classList.remove('open');
    }
  });

  setSearchMode('address');
}

// ─── PICK MODAL DRAG ───────────────────────────────────────────
const pickModal = document.getElementById('pick-modal');
const pickBox = document.getElementById('pick-box');
const pickHandle = document.getElementById('pick-handle');

let pickDragStartY = 0;
let pickDragging = false;
let pickDragDelta = 0;

function closePickModalDrag() {
  if (pickModal) pickModal.classList.remove('open');
  if (pickBox) {
    pickBox.style.transform = '';
    pickBox.style.transition = '';
  }
}

if (pickHandle) {
  pickHandle.addEventListener('pointerdown', e => {
    pickDragging = true;
    pickDragStartY = e.clientY;
    pickDragDelta = 0;
    if (pickBox) pickBox.style.transition = 'none';
    pickHandle.setPointerCapture?.(e.pointerId);
  });

  pickHandle.addEventListener('pointermove', e => {
    if (!pickDragging) return;
    pickDragDelta = Math.max(0, e.clientY - pickDragStartY);
    if (pickBox) pickBox.style.transform = `translateY(${pickDragDelta}px)`;
  });

  function endPickDrag() {
    if (!pickDragging) return;
    pickDragging = false;
    if (pickBox) {
      pickBox.style.transition = 'transform .22s cubic-bezier(.22,1,.36,1)';
      if (pickDragDelta > 90) {
        pickBox.style.transform = 'translateY(100%)';
        setTimeout(closePickModalDrag, 180);
      } else {
        pickBox.style.transform = 'translateY(0)';
      }
    }
  }

  pickHandle.addEventListener('pointerup', endPickDrag);
  pickHandle.addEventListener('pointercancel', endPickDrag);
}

map.on('load', () => {
  map.easeTo({ center: BASE.center, zoom: BASE.zoom, pitch: BASE.pitch, bearing: BASE.bearing, duration: 0, essential: true });

  try {
    map.setConfigProperty('basemap', 'lightPreset', 'night');
    map.setConfigProperty('basemap', 'show3dObjects', true);
    map.setConfigProperty('basemap', 'showPlaceLabels', false);
    map.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
    map.setConfigProperty('basemap', 'showRoadLabels', false);
    map.setConfigProperty('basemap', 'showTransitLabels', false);
  } catch (e) {}

  const geo = new mapboxgl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserHeading: true,
    showAccuracyCircle: false
  });
  map.addControl(geo, 'bottom-right');
  geo.on('geolocate', e => { userLocation = [e.coords.longitude, e.coords.latitude]; });
  setTimeout(() => {
    const gc = document.querySelector('.mapboxgl-ctrl-geolocate');

  ensureBuildingHighlightLayers();
  loadAll();

  bindAll();
  updateEncStatus();

  map.on('moveend', () => { if (buildingHighlightReady) renderMarkers(); });

});
